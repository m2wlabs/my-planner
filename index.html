<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Planner</title>
    <script>
      // If the bundle fails before React mounts, show the reason instead of a blank window.
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root || root.childElementCount) return;
        var message = String((event.error && event.error.message) || event.message || "Unknown error");
        root.innerHTML =
          '<div style="font-family:system-ui,sans-serif;padding:48px;color:#2a2933">' +
          '<h1 style="font-size:20px;margin:0 0 8px">My Planner could not start</h1>' +
          '<p style="margin:0 0 16px;color:#616167">Your data is safe in the local database.</p>' +
          '<pre style="white-space:pre-wrap;background:#f5f5f5;border-radius:12px;padding:12px;font-size:12px">' +
          message.replace(/[<>&]/g, function (c) { return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]; }) +
          "</pre>" +
          '<button onclick="location.reload()" style="margin-top:16px;height:36px;padding:0 18px;border:0;border-radius:999px;background:#5749f4;color:#fff;cursor:pointer">Reload app</button>' +
          "</div>";
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>My Planner needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
